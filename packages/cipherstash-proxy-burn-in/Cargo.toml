[package]
name = "cipherstash-proxy-burn-in"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
