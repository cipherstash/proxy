# Keeps the actions this repository's workflows use up to date, including the pinned commit of the shared Claude review
# workflow in .github/workflows/claude-review.yml.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Waits 7 days after a release before proposing it, so a bad release has time to be found first.
    cooldown:
      default-days: 7
