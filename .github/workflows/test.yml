name: Test
on:
  # No `branches` filter: run on pull requests targeting ANY base branch, not
  # just `main`. Stacked/queued PRs target intermediate branches (e.g.
  # `queue/<name>/...`), so a `branches: [main]` filter skipped CI on every PR
  # in a stack except the front one.
  #
  # No `paths-ignore` on pull_request either: "Build (Rust MSRV)" is a required
  # check, and a skipped workflow never reports it, which blocks the merge.
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
     - '.github/workflows/release.yml' # ignore unrelated workflow
     - '.github/workflows/benchmark.yml' # ignore unrelated workflow
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (PostgreSQL ${{ matrix.pg_version }})
    runs-on: runs-on=${{ github.run_id }}/family=c8a+m8a/cpu=8/image=ubuntu22-full-x64/volume=80gb/extras=s3-cache
    strategy:
      fail-fast: false
      matrix:
        pg_version: [14, 15, 16, 17] # PG 18 not currently supported
    env:
      PG_VERSION: ${{ matrix.pg_version }}
      CS_ZEROKMS_HOST: https://us-east-1.aws.zerokms.cipherstashmanaged.net
      CS_CTS_HOST: https://ap-southeast-2.aws.cts.cipherstashmanaged.net
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-test

      - name: Decrypt secrets
        uses: cipherstash/secrets-action@main
        with:
          secrets-file: .github/secrets.env.encrypted
        env:
          CS_CLIENT_ID: ${{ secrets.CS_VAULT_CLIENT_ID }}
          CS_CLIENT_KEY: ${{ secrets.CS_VAULT_CLIENT_KEY }}
          CS_CLIENT_ACCESS_KEY: ${{ secrets.CS_VAULT_CLIENT_ACCESS_KEY }}
          CS_WORKSPACE_CRN: ${{ secrets.CS_VAULT_WORKSPACE_CRN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_PASSWORD }}

      - run: |
          mise run postgres:up --extra-args "--detach --wait"

      - name: Run tests
        env:
          RUST_BACKTRACE: "1"
        run: |
          mise run --output prefix test

      - name: Show proxy logs on failure
        if: failure()
        run: |
          docker logs --timestamps proxy 2>&1 || true
          docker logs --timestamps proxy-tls 2>&1 || true

      - uses: ./.github/actions/send-slack-notification
        with:
          channel: engineering
          webhook_url: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK_URL }}

  # Toolchain checks outside the pinned toolchain. Neither needs PostgreSQL,
  # credentials, or the test matrix.
  #
  # MSRV: builds the production binary on `rust-version` from Cargo.toml, so a
  # change that raises the compiler requirement fails here.
  msrv:
    name: Build (Rust MSRV)
    runs-on: runs-on=${{ github.run_id }}/family=c8a+m8a/cpu=8/image=ubuntu22-full-x64/volume=80gb/extras=s3-cache
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Read MSRV from Cargo.toml
        id: msrv
        shell: /bin/bash -l {0}
        run: |
          set -euo pipefail
          # Read the root manifest directly: cargo itself would need the
          # rust-toolchain.toml toolchain installed first.
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [[ -z "${msrv}" ]]; then
            echo "::error::Cargo.toml [workspace.package] has no rust-version"
            exit 1
          fi
          echo "MSRV: ${msrv}"
          echo "version=${msrv}" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        shell: /bin/bash -l {0}
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal --no-self-update

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Build production binary
        shell: /bin/bash -l {0}
        env:
          # Overrides rust-toolchain.toml.
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          set -euo pipefail
          rustc --version
          declared=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cipherstash-proxy") | .rust_version')
          if [[ "${declared}" != "${{ steps.msrv.outputs.version }}" ]]; then
            echo "::error::cipherstash-proxy rust-version is '${declared}', expected '${{ steps.msrv.outputs.version }}'"
            exit 1
          fi
          cargo build --locked --release --package cipherstash-proxy

  # Latest stable: early warning that a new Rust release breaks the build or
  # adds Clippy lints, before the pinned toolchain is bumped to it.
  stable:
    name: Lint (Rust stable)
    runs-on: runs-on=${{ github.run_id }}/family=c8a+m8a/cpu=8/image=ubuntu22-full-x64/volume=80gb/extras=s3-cache
    timeout-minutes: 30
    env:
      # Overrides rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: stable

    steps:
      - uses: actions/checkout@v4

      - name: Install latest stable Rust
        shell: /bin/bash -l {0}
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustc --version

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: stable

      - name: Check formatting
        shell: /bin/bash -l {0}
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: /bin/bash -l {0}
        run: cargo clippy --locked --all --no-deps --all-targets --all-features -- -D warnings

  burn-in:
    name: Encrypted burn-in (PostgreSQL 17)
    runs-on: runs-on=${{ github.run_id }}/family=c8a+m8a/cpu=8/image=ubuntu22-full-x64/volume=80gb/extras=s3-cache
    timeout-minutes: 15
    env:
      PG_VERSION: 17
      CS_ZEROKMS_HOST: https://us-east-1.aws.zerokms.cipherstashmanaged.net
      CS_CTS_HOST: https://ap-southeast-2.aws.cts.cipherstashmanaged.net
      RUST_BACKTRACE: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-test

      - name: Decrypt secrets
        uses: cipherstash/secrets-action@main
        with:
          secrets-file: .github/secrets.env.encrypted
        env:
          CS_CLIENT_ID: ${{ secrets.CS_VAULT_CLIENT_ID }}
          CS_CLIENT_KEY: ${{ secrets.CS_VAULT_CLIENT_KEY }}
          CS_CLIENT_ACCESS_KEY: ${{ secrets.CS_VAULT_CLIENT_ACCESS_KEY }}
          CS_WORKSPACE_CRN: ${{ secrets.CS_VAULT_WORKSPACE_CRN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_PASSWORD }}

      - name: Start bare PostgreSQL and download EQL
        run: |
          mise run postgres:up --extra-args "--detach --wait"
          mise run eql:download
          mise run postgres:eql:teardown

      - name: Run encrypted burn-in
        run: mise run test:burn-in

      - name: Upload burn-in RSS report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: proxy-burn-in-pg17
          path: target/burn-in/soak-report.json
          if-no-files-found: warn

      - uses: ./.github/actions/send-slack-notification
        with:
          channel: engineering
          webhook_url: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK_URL }}

  pooler-compatibility:
    name: Supported pooler compatibility (PostgreSQL 17)
    runs-on: runs-on=${{ github.run_id }}/family=c8a+m8a/cpu=8/image=ubuntu22-full-x64/volume=80gb/extras=s3-cache
    timeout-minutes: 45
    env:
      PG_VERSION: 17
      CS_ZEROKMS_HOST: https://us-east-1.aws.zerokms.cipherstashmanaged.net
      CS_CTS_HOST: https://ap-southeast-2.aws.cts.cipherstashmanaged.net
      RUST_BACKTRACE: "1"
      POOLERS_GOLANG: supported

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-test

      - name: Decrypt secrets
        uses: cipherstash/secrets-action@main
        with:
          secrets-file: .github/secrets.env.encrypted
        env:
          CS_CLIENT_ID: ${{ secrets.CS_VAULT_CLIENT_ID }}
          CS_CLIENT_KEY: ${{ secrets.CS_VAULT_CLIENT_KEY }}
          CS_CLIENT_ACCESS_KEY: ${{ secrets.CS_VAULT_CLIENT_ACCESS_KEY }}
          CS_WORKSPACE_CRN: ${{ secrets.CS_VAULT_WORKSPACE_CRN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_PASSWORD }}

      - name: Verify gate rejects incomplete runs and induced regressions
        run: python3 tests/tasks/test/pooler_gate_test.py

      - name: Build current Proxy and gate supported pooler behavior
        # Below the job timeout, so a hung gate fails this step and the
        # evidence upload below still runs.
        timeout-minutes: 35
        run: mise run test:poolers

      - name: Upload matrix and driver evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: proxy-pooler-compatibility-pg17
          path: target/pooler-results/
          if-no-files-found: warn

      - uses: ./.github/actions/send-slack-notification
        with:
          channel: engineering
          webhook_url: ${{ secrets.SLACK_NOTIFICATION_WEBHOOK_URL }}
