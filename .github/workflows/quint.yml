name: Quint specifications
# Design-level model of statement routing; see specs/quint/README.md.
# Not a required check: it is a pilot.
on:
  pull_request:
    paths:
      - 'specs/quint/**'
      - '.github/workflows/quint.yml'
  push:
    branches:
      - main
    paths:
      - 'specs/quint/**'
      - '.github/workflows/quint.yml'
  workflow_dispatch:

jobs:
  model-check:
    name: Quint model check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: specs/quint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: specs/quint/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Apalache (bundles TLC)
        uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-apalache-${{ hashFiles('specs/quint/package-lock.json') }}
      - name: Install the pinned Quint CLI
        run: npm ci --ignore-scripts
      - name: Typecheck, scenario tests and simulation
        run: ./check.sh basic
      - name: TLC model checking
        run: ./check.sh tlc
      - name: Mutation tests
        run: ./check.sh mutations
