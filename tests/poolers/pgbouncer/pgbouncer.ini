; PgBouncer configuration for the connection pooler compatibility matrix.
;
; One PgBouncer instance serves both topologies and both pool modes through
; database aliases. The client picks the cell by database name:
;
;   app -> PgBouncer -> Proxy -> PostgreSQL
;     proxy_session / proxy_txn          Proxy with a default keyset, pool of 2
;     proxy_one_session / proxy_one_txn  Proxy with a default keyset, pool of 1
;     proxy_mt_session / proxy_mt_txn    Proxy without a default keyset (multitenant), pool of 1
;     proxy_mt_local_txn                 as proxy_mt_txn, reserved for the SET LOCAL check so
;                                        it never inherits state from the session SET check
;     app_session / app_txn              Proxy with a default keyset, pool of 40, for driver
;                                        suites that run many connections in parallel
;
;   app -> Proxy -> PgBouncer -> PostgreSQL
;     pg_session / pg_txn                PostgreSQL, pool of 2
;     pg_schema                          PostgreSQL, used only by Proxy's schema loader
;     pg_app_session / pg_app_txn        PostgreSQL, pool of 40, for driver suites
;
; Pools of one make server connection reuse deterministic: two clients of the
; same alias always share the single server connection, which is exactly the
; situation in which per-connection state in Proxy can cross between clients.
;
; `max_prepared_statements` is appended by entrypoint.sh when the container sets
; PGBOUNCER_MAX_PREPARED_STATEMENTS, because PgBouncer < 1.21 rejects the key.

[databases]
proxy_session = host=proxy port=6432 dbname=cipherstash pool_mode=session pool_size=2
proxy_txn = host=proxy port=6432 dbname=cipherstash pool_mode=transaction pool_size=2
proxy_one_session = host=proxy port=6432 dbname=cipherstash pool_mode=session pool_size=1
proxy_one_txn = host=proxy port=6432 dbname=cipherstash pool_mode=transaction pool_size=1
proxy_mt_session = host=proxy-mt port=6432 dbname=cipherstash pool_mode=session pool_size=1
proxy_mt_txn = host=proxy-mt port=6432 dbname=cipherstash pool_mode=transaction pool_size=1
proxy_mt_local_txn = host=proxy-mt port=6432 dbname=cipherstash pool_mode=transaction pool_size=1
app_session = host=proxy port=6432 dbname=cipherstash pool_mode=session pool_size=40
app_txn = host=proxy port=6432 dbname=cipherstash pool_mode=transaction pool_size=40
pg_session = host=postgres port=5532 dbname=cipherstash pool_mode=session pool_size=2
pg_txn = host=postgres port=5532 dbname=cipherstash pool_mode=transaction pool_size=2
pg_schema = host=postgres port=5532 dbname=cipherstash pool_mode=session pool_size=4
pg_app_session = host=postgres port=5532 dbname=cipherstash pool_mode=session pool_size=40
pg_app_txn = host=postgres port=5532 dbname=cipherstash pool_mode=transaction pool_size=40

[pgbouncer]
listen_addr = *
listen_port = 6432

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

max_client_conn = 200
default_pool_size = 2
min_pool_size = 0

; Defaults, stated explicitly because the matrix depends on them:
; the reset query runs when a session-mode client disconnects, and is not run
; in transaction mode.
server_reset_query = DISCARD ALL
server_reset_query_always = 0

; Proxy closes a connection that has been idle for CS_DATABASE__CONNECTION_TIMEOUT
; (120 s by default). Retire idle server connections before Proxy does.
server_idle_timeout = 60

ignore_startup_parameters = extra_float_digits

log_connections = 1
log_disconnections = 1
verbose = 0
